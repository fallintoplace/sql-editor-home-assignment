name: ClickStudio native explorers validation
on:
  push:
    branches: [work/clickstudio-native-explorers-validation]
    paths: [.github/native-patch/**, .github/workflows/clickstudio-native-stage.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply reviewed compatibility and layout fixes
        id: apply
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git apply --3way --index .github/native-patch/review.patch
          git diff --cached --check
          git commit -m 'fix: keep comparison metrics visible and support older refresh metadata'
          git push origin HEAD:work/clickstudio-native-explorers-validation
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  review:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: clickstudio
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - run: npm ci
      - run: npm run review 2>&1 | tee native-review.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-review
          path: clickstudio/native-review.log
  browser:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: clickstudio
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Feature interactions and metric visibility
        run: npx playwright test tests/e2e/native-explorers.spec.ts 2>&1 | tee native-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-explorer-screenshots
          path: |
            clickstudio/native-browser.log
            clickstudio/test-results
            clickstudio/playwright-report
      - name: Production frontend preview
        run: npm run test:e2e:preview 2>&1 | tee native-preview.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-preview
          path: |
            clickstudio/native-preview.log
            clickstudio/test-results
            clickstudio/playwright-report
  integration:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: clickstudio
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - run: npm ci
      - run: npm run init:env && docker compose up -d --wait clickhouse && npm run db:setup
      - run: CLICKHOUSE_INTEGRATION=1 npm run test:integration 2>&1 | tee native-integration.log
      - run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-integration
          path: clickstudio/native-integration.log
      - if: always()
        run: docker compose down -v
