name: ClickStudio validation
concurrency:
  group: clickstudio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths: ["clickstudio/**", "package.json", "src/index.ts", ".github/workflows/clickstudio.yml"]
  pull_request:
    paths: ["clickstudio/**", "package.json", "src/index.ts", ".github/workflows/clickstudio.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast-tests:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clickstudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and test syntax
        run: npm run check:syntax
      - name: TypeScript contracts
        run: npm run typecheck
      - name: Core and workspace coverage gates
        run: npm run coverage
      - name: Production build
        run: npm run build:app

  long-tests:
    name: Long tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: clickstudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Local-only credentials and ClickHouse 24.6
        id: database
        run: npm run init:env && docker compose up -d --wait clickhouse && npm run db:setup
      - name: HTTP integration and LIVE ClickHouse fixture checks
        run: CLICKHOUSE_INTEGRATION=1 npm run test:integration
      - name: Deterministic SQL evaluations
        run: npm run eval
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser suite (fixture driver)
        run: npm run test:e2e
      - name: Vercel static preview parser and export smoke test
        run: npm run test:e2e:vercel
      - name: Capture ClickHouse diagnostics
        if: ${{ failure() && steps.database.outcome != 'skipped' }}
        run: docker compose logs --no-color > clickhouse-compose.log 2>&1 || true
      - name: Preserve ClickHouse diagnostics
        if: ${{ failure() && steps.database.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: clickstudio-clickhouse-diagnostics
          path: clickstudio/clickhouse-compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clickstudio-browser-diagnostics
          path: |
            clickstudio/playwright-report
            clickstudio/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickstudio-ux-screenshots
          path: clickstudio/test-results/**/clickstudio-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local services
        if: ${{ always() && steps.database.outcome != 'skipped' }}
        run: docker compose down -v
