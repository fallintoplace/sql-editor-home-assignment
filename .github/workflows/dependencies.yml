name: Dependency validation
on:
  push:
    branches: [cathedral/workbench-validation]
    paths: [package.json, .github/workflows/dependencies.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: tar -czf /tmp/cathedral-dependencies.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: cathedral-dependencies
          path: /tmp/cathedral-dependencies.tgz
          retention-days: 1
