name: Geo wire debug

on:
  push:
    branches:
      - debug/playground-geo-wire

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print ClickHouse Point wire format
        shell: bash
        run: |
          cat > /tmp/query.sql <<'SQL'
          SELECT 'Berlin' AS city, (13.405, 52.52)::Point AS location, 120 AS events
          UNION ALL
          SELECT 'Paris', (2.3522, 48.8566)::Point, 95
          UNION ALL
          SELECT 'London', (-0.1276, 51.5072)::Point, 140
          UNION ALL
          SELECT 'Madrid', (-3.7038, 40.4168)::Point, 80
          FORMAT JSONCompactStringsEachRowWithNamesAndTypes
          SQL
          curl --fail-with-body --silent --show-error \
            'https://sql-clickhouse.clickhouse.com:8443/?user=demo' \
            --data-binary @/tmp/query.sql
