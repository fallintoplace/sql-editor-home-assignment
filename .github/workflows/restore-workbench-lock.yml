name: Recover reviewed workbench lock
on:
  push:
    branches: ["feat/cathedral-workbench"]
    paths: [".github/workflows/restore-workbench-lock.yml"]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'fallintoplace/sql-editor-home-assignment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: workbench-dependency-lock
          run-id: 35675233489
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cathedral-lock
      - name: Validate and commit the captured lock
        env:
          LOCK: ${{ runner.temp }}/cathedral-lock/package-lock.json
        run: |
          set -euo pipefail
          test "$(git hash-object "$LOCK")" = a676b40a2edaeb86d0d42c312b3e32c47a66d52d
          node --input-type=commonjs <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');
          const lock = JSON.parse(readFileSync(process.env.LOCK, 'utf8'));
          const manifest = JSON.parse(readFileSync('workbench/package.json', 'utf8'));
          assert.equal(lock.lockfileVersion, 3);
          const root = lock.packages[''];
          for (const key of ['name', 'version', 'dependencies', 'devDependencies', 'engines'])
            assert.deepEqual(root[key], manifest[key], key);
          console.log('Verified the captured lock and all manifest dependency declarations.');
          NODE
          cp "$LOCK" workbench/package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workbench/package-lock.json
          git rm .github/workflows/restore-workbench-lock.yml
          git commit -m 'build: pin the reviewed workbench dependency graph'
          git push origin HEAD:refs/heads/feat/cathedral-workbench
